services:
  app:
    restart: on-failure
    build:
      context: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/backend_go?sslmode=disable
      OIDC_ISSUER_URL: http://keycloak:8080/realms/backend-go
      OIDC_DISCOVERY_TIMEOUT: 5s
      OIDC_AUDIENCE: backend-go
      SQS_ENDPOINT: http://localstack:4566
      SQS_REGION: us-east-1
      SQS_OPERATIONS_QUEUE_URL: http://localstack:4566/000000000000/operations.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/events.fifo
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend_go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # dev-only default
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_go"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # dev-only default
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
